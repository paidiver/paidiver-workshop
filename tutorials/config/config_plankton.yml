general:
  input_path: "images/plankton"
  metadata_path: "metadata/metadata_plankton.csv"
  metadata_type: "CSV_FILE"
  image_open_args: "BMP"
  output_path: "output/pelagic"
  n_jobs: 1

steps:
  - colour:
      name: even_lighting
      mode: illumination_correction
      params:
        method: rolling
        radius: 10
  - colour:
      name: local_contrast
      mode: contrast
      params:
        method: clahe
        clip_limit: 0.01
  - colour:
      name: gentle_blur
      mode: gaussian_blur
      params:
        sigma: 1.0
