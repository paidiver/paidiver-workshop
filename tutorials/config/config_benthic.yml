general:
  input_path: "images/benthic2"
  metadata_path: "metadata/metadata_benthic2.json"
  metadata_type: "IFDO"
  output_path: "output/benthic2"  
  n_jobs: 2
  rename: "datetime"
  sampling:
    - mode: "fixed"
      params:
        value: 50
steps:
  - colour:
      name: "colour_correction"
      mode: "grayscale"

  - sampling:
      name: "datetime"
      mode: "datetime"
      # test: True
      params:
        min: "2013-04-23 00:00:00"
        max: "2013-04-23 23:59:00"

  - colour:
      name: "colour_correction"
      mode: "gaussian_blur"
      params:
        sigma: 1.0

  - colour:
      name: "sharpen"
      mode: "sharpen"
      params:
        alpha: 1.5
        beta: 0.5

  - colour:
      name: "contrast"
      mode: "contrast"

  - convert:
      name: "crop_images"
      mode: "crop"
      params:
        size: 0.5
        size_type: "percent"
        mode: "center"
