general:
  input_path: "images/benthic"
  metadata_path: "metadata/metadata_benthic.json"
  metadata_type: "IFDO"
  output_path: output/introduction
  n_jobs: 1
  sampling:
    - mode: fixed
      params:
        value: 5
steps:
  - colour:
      name: grayscale
      mode: grayscale
  - colour:
      name: gentle_blur
      mode: gaussian_blur
      params:
        sigma: 1.0
